name: Publish

# Publishes to npm and the official MCP Registry when a version tag is pushed.
#
# Neither step stores a secret. Both authenticate with GitHub OIDC: npm through
# trusted publishing, configured against this repository and this workflow file
# on the package's npm settings page, and the registry through its own OIDC
# login. Renaming this file breaks the npm trust relationship.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for both npm provenance and MCP Registry OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Trusted publishing needs a recent npm; the one bundled with Node may
      # predate OIDC support. Provenance is implied, so the flag is not passed.
      - run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to the official MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
