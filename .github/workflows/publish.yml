name: Publish

# Publishes to npm and the official MCP Registry when a version tag is pushed.
#
# Neither step stores a secret. Both authenticate with GitHub OIDC: npm through
# trusted publishing, configured against this repository and this workflow file
# on the package's npm settings page, and the registry through its own OIDC
# login. Renaming this file breaks the npm trust relationship.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for both npm provenance and MCP Registry OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Trusted publishing needs a recent npm; the one bundled with Node may
      # predate OIDC support. Provenance is implied, so the flag is not passed.
      - run: npm install -g npm@latest

      # Re-running a release must not fail on a version that is already out, so
      # that a failure in a later step can be retried without a version bump.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "zotero-native-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already on npm, skipping publish"
          else
            npm publish --access public
          fi

      # The registry verifies the npm package before accepting the server, and a
      # publish takes a moment to reach every npm CDN node. Without this wait the
      # registry reads a 404 for a version that was just published and rejects it.
      - name: Wait for npm to serve the new version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if curl -fsS "https://registry.npmjs.org/zotero-native-mcp/$VERSION" >/dev/null 2>&1; then
              echo "$VERSION is being served after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "npm did not serve $VERSION within 5 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to the official MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
