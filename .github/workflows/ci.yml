name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every broken combination, not just the first one to fail.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 20 reached end of life in April 2026. 22 is the active LTS, 24 the
        # current release, 26 what the project is developed on.
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # The integration suite skips itself when no Zotero answers on
      # 127.0.0.1:23119, which is the case on every runner. What runs here is
      # the unit suite plus the protocol tests against the mock Zotero.
      - run: npm test
