name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Integration tests skip themselves when no Zotero is reachable, which is
      # always the case on a CI runner. Unit tests use a mock Zotero instead.
      - run: npm test
